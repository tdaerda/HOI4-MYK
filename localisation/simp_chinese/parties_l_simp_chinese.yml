 # # #中间派
 
 classical_liberalism: "古典自由主义"
 classical_liberalism_noun: "古典自由主义"
 classical_liberalism_desc: "共和政体"
 classical_liberalism_c: "古典自由主义"
 classical_liberalism_c_desc: "基本介绍：\n古典自由主义（classical liberalism）是一\n种在18世纪由小资产阶级建立的意识形态，认为应该遵循自由市场，政府的干预会障碍经济的发展，总之§Y真伟大啊哈耶克§!\n\n\n政治主张：\n古典自由主义认为个人先于国家，强调私有财产不可侵犯，政府不可干预经济并保护每个人的自由，反对君权神授、世袭君主、国教\n\n\n近代影响："
 
 social_democracy: "社会民主主义"
 social_democracy_noun: "社会民主主义"
 social_democracy_desc: "共和政体"
 social_democracy_c: "社会民主主义"
 social_democracy_c_desc: "基本介绍：\n社会民主主义（Social democracy）是一种在民主体\n制和资本主义内融合社会主义的思想，认为应该在资本主义的框架内通过经济干预实现社会主义。总之§Y真伟大啊凯恩斯§!\n\n\n政治主张：\n社会民主主义认为应该通过政府干预的方式进行收入平衡，建设福利国家，并和其他中左翼一样支持间接民主制，希望让资本主义更加平等。"
 
 democratic_socialism: "民主社会主义"
 democratic_socialism_noun: "民主社会主义"
 democratic_socialism_desc: "共和政体"
 democratic_socialism_c: "民主社会主义"
 democratic_socialism_c_desc: ""
 
 accelerationism: "加速主义"
 accelerationism_noun: "加速主义"
 accelerationism_desc: "技术官僚政体"
 accelerationism_c: "加速主义"
 accelerationism_c_desc: "基本介绍：\n加速主义（Accelerationism）是一种比较抽象的概念，大体上就是认为科学优先和激化社会矛盾通过世界大战的方式进行加速的科学发展。\n\n\n政治主张：\n加速主义最开始是一种基于资本主义的意识形态的意识形态，认为资本主义和技术应该进行快速的变革，\n后面分裂出了左翼加速主义，左翼加速主义认为加速主义不应该局限于资本主义，这种社会与技术的变革应该用于解放人类。有左就有右，右翼加速主义认为资本主义应该无限强化，因为发展科技是对公司有利的，而按照资本逐利的概念，资本一定会疯狂的研发新技术夺取顾客。\n还有无限制加速主义，它认为加速主义不应该服务于左或者右，应该自成一派，也就是第三条陆。"
 
