 anarchism: "无政府状态"
 anarchism_noun: "无政府状态"
 anarchism_desc: "§R[错误 错误 错误]§!"
 anarchism_c: "无政府状态"
 anarchism_c_desc: "基本介绍：\n无政府状态（anarchy）是指一个地区没有任何有效的统治者、政府和权威，当地一般陷入彻底的混乱和无序当中，但有些地方还会保留着一定的秩序，比如村庄和军阀\n\n\n政治主张：\n无政府状态不是一种意识形态。"
 
 # # #左翼
 
 anarcho_communism: "无政府共产主义"
 anarcho_communism_noun: "无政府共产主义"
 anarcho_communism_desc: "无政府政体。"
 anarcho_communism_c: "无政府共产主义"
 anarcho_communism_c_desc: ".无政府共产主义（Anarcho-Communism）是一种无政府主义的流派，也是狭义上的无政府主义，核心是通过自愿合作建立一个以生产资料公有制为基础、无阶级分化的自由社会。它认为国家和资本是压迫的根源。\n\n\n政治主张：\n无政府共产主义主张废除作为压迫根源的国家与资本主义，建立生产资料公有制，通过工人协会、社区合作社等基层自治组织实现直接民主与自愿联合，拒绝等级权威，倡导资源按需分配以消除剥削和阶级差异，主张通过社会革命推翻现有政权，构建无国家、无阶级的自由平等共同体。"
 
